# Disable automatic seed.sql execution
[db.seed]
enabled = false

# open FDA Edge Function Configuration
[functions.import-openfda]
enabled = true
verify_jwt = false
import_map = "./functions/import-openfda/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/import-openfda/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/import-openfda/*.html" ]
